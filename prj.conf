# Display support for micro:bit 5x5 LED matrix
CONFIG_GPIO=y
CONFIG_DISPLAY=y
CONFIG_MICROBIT_DISPLAY=y

# Sensor support (LSM303AGR accelerometer via lis2dh driver)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LIS2DH=y
CONFIG_LIS2DH_ACCEL_RANGE_2G=y
CONFIG_LIS2DH_ODR_4=y
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y

# PWM buzzer for sound effects
CONFIG_PWM=y

# Floating point support for sensor values
CONFIG_CBPRINTF_FP_SUPPORT=y

# Entropy for random number generation
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=n
